name: Build AltF10 Library

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Check out Git repository
      uses: actions/checkout@v4

    - name: Install Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22
        # cache: 'npm'

    - name: Install Dependencies
      run: npm ci

    - name: Download FFmpeg and FFprobe
      shell: powershell
      run: |
        New-Item -ItemType Directory -Force -Path "bin"
        
        $url = "https://www.gyan.dev/ffmpeg/builds/ffmpeg-git-full.7z"
        $output = "ffmpeg.7z"
        
        Write-Host "Downloading FFmpeg master build..."
        Invoke-WebRequest -Uri $url -OutFile $output
        
        Write-Host "Extracting from 7z archive..."
        7z x $output -o"ffmpeg_temp" -y
        
        Write-Host "Moving files..."

        $extractedFolder = Get-ChildItem -Path "ffmpeg_temp" -Directory | Select-Object -First 1
        $binPath = "$($extractedFolder.FullName)\bin"
        
        Move-Item -Path "$binPath\ffmpeg.exe" -Destination "bin\ffmpeg.exe" -Force
        Move-Item -Path "$binPath\ffprobe.exe" -Destination "bin\ffprobe.exe" -Force
        
        Write-Host "Cleaning up..."
        Remove-Item $output
        Remove-Item "ffmpeg_temp" -Recurse -Force
        
        Write-Host "FFmpeg is ready"
      
    - name: Build Electron App (Unsigned)
      run: npm run electron:build
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Create Draft Release
      uses: softprops/action-gh-release@v1
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: dist/*.exe
        draft: true
        prerelease: false
        generate_release_notes: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  build-linux:
    runs-on: ubuntu-latest
    steps:
    - name: Check out Git repository
      uses: actions/checkout@v4

    - name: Install Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22

    - name: Install Dependencies
      run: npm ci

    - name: Download FFmpeg (Linux)
      run: |
        mkdir -p bin
        wget https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz
        
        tar -xf ffmpeg-master-latest-linux64-gpl.tar.xz
        
        mv ffmpeg-master-latest-linux64-gpl/bin/ffmpeg bin/
        mv ffmpeg-master-latest-linux64-gpl/bin/ffprobe bin/
        
        rm -rf ffmpeg-master-latest-linux64-gpl*

    - name: Build Electron App (Linux)
      run: npm run electron:build -- --linux
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload Release Asset (Linux)
      uses: softprops/action-gh-release@v1
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: dist/*.AppImage
        draft: true
        generate_release_notes: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}